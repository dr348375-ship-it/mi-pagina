<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ 'Crear administrador' if setup else 'Iniciar sesión' }} · RT Producciones</title>
  <link rel="icon" type="image/svg+xml" href="/marca/icono-rt.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="admin-contenedor">
    <a class="marca marca-admin" href="/" aria-label="RT Producciones, página principal"><img src="/marca/logo-rt.svg" width="460" height="112" alt="RT Producciones"></a>
    <a href="/">Volver a la página</a>
    <h1>{{ 'Crear administrador' if setup else 'Iniciar sesión' }}</h1>
    <p>{{ 'Elige tu usuario y una contraseña de al menos 12 caracteres.' if setup else 'Ingresa a la administración del catálogo.' }}</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ session.csrf }}">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" minlength="3" maxlength="80" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="{{ 'new-password' if setup else 'current-password' }}" {% if setup %}minlength="12"{% endif %} maxlength="256" required>
      {% if setup %}
      <label for="confirmacion">Repite la contraseña</label>
      <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
      {% endif %}
      <button class="boton" type="submit">{{ 'Crear mi cuenta' if setup else 'Entrar' }}</button>
    </form>
  </main>
</body>
</html>
